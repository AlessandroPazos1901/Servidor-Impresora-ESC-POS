version: '3.8'

services:
  thermal-printer-server:
    build: .
    container_name: thermal-printer-server
    restart: unless-stopped

    # Configuración de red
    ports:
      - "3001:3001"

    # Variables de entorno (personalizar según necesidad)
    environment:
      - NODE_ENV=production
      - TZ=America/Lima
      - PORT=${PORT:-3001}
      - PRINTER_IP=${PRINTER_IP:-192.168.1.200}
      - PRINTER_PORT=${PRINTER_PORT:-9100}
      - PRINT_SERVER_SECRET=${PRINT_SERVER_SECRET:-your-secret-token-here}
      # ngrok configuration
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_DOMAIN=${NGROK_DOMAIN:-}
      - USE_NGROK=${USE_NGROK:-true}

    # Volúmenes para persistencia
    volumes:
      # Logs persistentes
      - ./logs:/usr/src/app/logs
      # Configuración personalizada (opcional)
      - ./.env:/usr/src/app/.env:ro

    # Configuración de red para acceso a impresora local
    network_mode: "host"

    # Configuración de salud
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    # Límites de recursos
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    
    # Configuración de logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Configuración de seguridad
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    
    # Etiquetas para organización
    labels:
      - "com.thermal-printer.service=server"
      - "com.thermal-printer.version=2.0"
      - "com.thermal-printer.description=Ultra-reliable thermal printer server"

# Red personalizada (opcional - usar si no usas network_mode: host)
networks:
  printer-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volúmenes nombrados para persistencia
volumes:
  logs-data:
    driver: local
  certs-data:
    driver: local